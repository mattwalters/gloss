name: settings-defaults
description: >
  Initial settings op setting only the workspace name.
  Verifies that all untouched settings properties receive their canonical defaults
  (timezone: UTC, estimate_scale: fibonacci, cycle_duration_weeks: 2, etc.).

refs:
  - name: refs/writ/0123456789abcdef/settings
    history:
      - commits:
          - id: alice-set-name
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: set
              op_version: 1
              body:
                name: "Default Workspace"
            expect: accept
