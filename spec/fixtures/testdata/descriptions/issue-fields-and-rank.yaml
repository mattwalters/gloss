name: issue-fields-and-rank
description: >
  Two independent writers (Alice and Bob) concurrently create distinct issue
  objects (i-fields-alice and i-fields-bob) with identical fractional positions ('V')
  at the same timestamp. Verifies deterministic tiebreak ordering by op_id ASC, and that
  subsequent metadata updates on one object do not disturb the deterministic position tiebreak.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-fields-alice
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Alice Issue"
                description: "Testing priority, estimate, and manual rank"
                priority: 1
                estimate: 2.5
                position: "V"
            expect: accept

          - id: alice-update
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-fields-alice
              object_type: issue
              op_type: update
              op_version: 1
              body:
                priority: 2
                estimate: 5.0
            expect: accept

  - name: refs/writ/fedcba9876543210/issue
    history:
      - commits:
          - id: bob-create
            author: bob
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-fields-bob
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Bob Issue"
                description: "Concurrent rank insertion at same slot"
                priority: 3
                estimate: 8.0
                position: "V"
            expect: accept

          - id: bob-update
            parents: [bob-create]
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-fields-bob
              object_type: issue
              op_type: update
              op_version: 1
              body:
                title: "Bob Issue Renamed"
                priority: 4
                estimate: 10.0
            expect: accept
