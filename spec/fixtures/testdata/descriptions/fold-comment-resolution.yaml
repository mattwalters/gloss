name: fold-comment-resolution
description: >
  Thread resolution exercising: resolve operation with actor, reply-after-resolve
  (root remains resolved), explicit unresolve, concurrent resolve vs unresolve
  racing across writer branches (lww tiebreak), and person identifier
  normalization of the resolution actor (whitespace trimming, case folding)
  at the fold layer.

refs:
  - name: refs/writ/0123456789abcdef/comment
    history:
      - commits:
          - id: alice-res-root-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: c-res-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Root comment to be resolved"
            expect: accept

          - id: alice-res-root-resolve
            parents: [alice-res-root-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: c-res-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: true
                actor: alice
            expect: accept

          - id: alice-unres-root-create
            parents: [alice-res-root-resolve]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: c-unres-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Root comment to be resolved then reopened"
            expect: accept

          - id: alice-unres-root-resolve
            parents: [alice-unres-root-create]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: c-unres-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: true
                actor: alice
            expect: accept

          - id: alice-unres-root-unresolve
            parents: [alice-unres-root-resolve]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: c-unres-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: false
            expect: accept

          - id: alice-race-root-create
            parents: [alice-unres-root-unresolve]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: c-race-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Root comment with concurrent resolve race"
            expect: accept

          - id: alice-race-root-resolve
            parents: [alice-race-root-create]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: c-race-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: true
                actor: alice
            expect: accept

          - id: alice-norm-root-create
            parents: [alice-race-root-resolve]
            author: alice
            timestamp: 2026-01-01T00:07:00Z
            op:
              object_id: c-norm-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Root comment resolved by a non-normalized actor"
            expect: accept

          - id: alice-norm-root-resolve
            parents: [alice-norm-root-create]
            author: alice
            timestamp: 2026-01-01T00:08:00Z
            op:
              object_id: c-norm-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: true
                actor: "  Alice@Example.COM  "
            expect: accept

  - name: refs/writ/fedcba9876543210/comment
    history:
      - commits:
          - id: bob-res-reply-create
            parents: [alice-res-root-resolve]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: c-res-reply
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                in_reply_to: "c-res-root"
                text: "Reply posted after thread was resolved"
            expect: accept

          - id: bob-race-root-unresolve
            parents: [alice-race-root-create]
            author: bob
            timestamp: 2026-01-01T00:06:30Z
            op:
              object_id: c-race-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: false
            expect: accept
