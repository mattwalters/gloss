name: project-membership-races
description: >
  Single project object p-races exercising creation, metadata update, status transition,
  causal member removal, and concurrent add-issue vs remove-issue across Alice and Bob.

refs:
  - name: refs/writ/0123456789abcdef/project
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: create
              op_version: 1
              body:
                title: "Core Redesign"
                description: "Redesign core storage"
            expect: accept

          - id: alice-update
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: update
              op_version: 1
              body:
                title: "Core Storage Redesign"
            expect: accept

          - id: alice-status
            parents: [alice-update]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: set-status
              op_version: 1
              body:
                status: "active"
                reason: "Approved by committee"
            expect: accept

          - id: alice-add-iss1
            parents: [alice-status]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: add-issue
              op_version: 1
              body:
                issue: "0123456789abcdef0123456789abcdef"
            expect: accept

          - id: alice-add-iss2
            parents: [alice-add-iss1]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: add-issue
              op_version: 1
              body:
                issue: "repo-web#fedcba9876543210fedcba9876543210"
            expect: accept

          - id: alice-causal-rem-iss1
            parents: [alice-add-iss2]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: remove-issue
              op_version: 1
              body:
                issue: "0123456789abcdef0123456789abcdef"
            expect: accept

          - id: alice-concurrent-rem-iss3
            parents: [alice-causal-rem-iss1]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: p-races
              object_type: project
              op_type: remove-issue
              op_version: 1
              body:
                issue: "11112222333344445555666677778888"
            expect: accept

  - name: refs/writ/fedcba9876543210/project
    history:
      - commits:
          - id: bob-concurrent-add-iss3
            parents: [alice-causal-rem-iss1]
            author: bob
            timestamp: 2026-01-01T00:06:30Z
            op:
              object_id: p-races
              object_type: project
              op_type: add-issue
              op_version: 1
              body:
                issue: "11112222333344445555666677778888"
            expect: accept
