name: label-forward-compat
description: >
  Label object with unknown top-level envelope fields, unknown body fields, and
  an unknown op type. Under forward compatibility rules, fold ignores unknown fields
  and preserves unknown ops in the folded state without error.

refs:
  - name: refs/writ/0123456789abcdef/label
    history:
      - commits:
          - id: alice-create-future
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: lbl-future
              object_type: label
              op_type: create
              op_version: 1
              body:
                name: "enhancement"
                color: "#a2eeef"
                icon: "sparkle"
              client_build: 999
            expect: accept

          - id: alice-unknown-op
            parents: [alice-create-future]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: lbl-future
              object_type: label
              op_type: archive
              op_version: 1
              body:
                reason: "deprecated"
            expect: accept
