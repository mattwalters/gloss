name: workflow-state-concurrent-edits
description: >
  Two writers (Alice and Bob) concurrently update properties of workflow state ws-concurrent.
  Alice updates name and color, while Bob concurrently updates name and position.
  Exercises field-level LWW merge semantics across concurrent commits.

refs:
  - name: refs/writ/0123456789abcdef/workflow-state
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: ws-concurrent
              object_type: workflow-state
              op_type: create
              op_version: 1
              body:
                name: "Todo"
                type: "unstarted"
                position: "V"
                color: "#3b82f6"
                description: "Things to do"
            expect: accept

          - id: alice-edit
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: ws-concurrent
              object_type: workflow-state
              op_type: update
              op_version: 1
              body:
                name: "Sprint Todo"
                color: "#2563eb"
            expect: accept

  - name: refs/writ/fedcba9876543210/workflow-state
    history:
      - commits:
          - id: bob-edit
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: ws-concurrent
              object_type: workflow-state
              op_type: update
              op_version: 1
              body:
                name: "Ready For Dev"
                position: "W"
            expect: accept
