name: fold-ordering-fractional
description: >
  Two writers (Alice and Bob) concurrently insert items with identical fractional
  position keys ('aV') into review r-fractional-order at the same timestamp.
  Demonstrates deterministic total ordering by effective time t* and op-id (commit SHA)
  tiebreak, with commutativity across DAG evaluation order.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-fractional-order
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Fractional Ordering Root"
            expect: accept

          - id: alice-insert
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-fractional-order
              object_type: review
              op_type: update
              op_version: 1
              body:
                title: "Alice Concurrent Insert at aV"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-insert
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-fractional-order
              object_type: review
              op_type: update
              op_version: 1
              body:
                title: "Bob Concurrent Insert at aV"
            expect: accept
