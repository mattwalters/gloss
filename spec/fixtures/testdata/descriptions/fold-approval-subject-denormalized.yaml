name: fold-approval-subject-denormalized
description: >
  Approval ops whose LWW-winning write carries a denormalized subject
  ('  Carol@Example.COM  ', 'DAVE@EXAMPLE.COM'), as a pre-normalization or
  foreign client would emit. Verifies that keyed-lww normalizes the stored
  person identifier and not merely the composite key, so the folded 'subject'
  entry reads back normalized and agrees with the typed review reducer.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-subject-denorm
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Denormalized Approval Subject Test"
            expect: accept

          - id: alice-revision
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-subject-denorm
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0000000000000000000000000000000000000001"
                head: "0000000000000000000000000000000000000002"
            expect: accept

          - id: alice-carol-normalized
            parents: [alice-revision]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-subject-denorm
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                subject: "carol@example.com"
                message: "Carol approves under a normalized subject"
            expect: accept

          - id: alice-carol-denormalized
            parents: [alice-carol-normalized]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-subject-denorm
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: request-changes
                subject: "  Carol@Example.COM  "
                message: "Same Carol, denormalized subject, later write wins"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-dave-denormalized
            parents: [alice-revision]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-subject-denorm
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                subject: " DAVE@Example.com "
                message: "Dave's only write is denormalized"
            expect: accept
