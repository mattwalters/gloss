name: document-sections-concurrent
description: >
  Two writers (Alice and Bob) concurrently edit and reorder document sections.
  Alice creates document doc-1 and two sections (sec-1 and sec-2).
  Alice and Bob concurrently edit the body of sec-2, exercising multi-value register
  conflict preservation. Bob also updates section position to exercise fractional ordering.

refs:
  - name: refs/writ/0123456789abcdef/document
    history:
      - commits:
          - id: alice-doc-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: doc-1
              object_type: document
              op_type: create
              op_version: 1
              body:
                title: "RFC: Document Object Model"
            expect: accept

          - id: alice-doc-link
            parents: [alice-doc-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: doc-1
              object_type: document
              op_type: link
              op_version: 1
              body:
                target: "issue-123"
                target_type: "issue"
                relation: "implementation-plan"
            expect: accept

          - id: alice-doc-label
            parents: [alice-doc-link]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: doc-1
              object_type: document
              op_type: label
              op_version: 1
              body:
                add: ["design", "rfc"]
            expect: accept

  - name: refs/writ/0123456789abcdef/section
    history:
      - commits:
          - id: alice-sec1-create
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: sec-1
              object_type: section
              op_type: create
              op_version: 1
              body:
                document_id: doc-1
                position: "V"
                title: "Motivation"
                body: "Markdown documentation in git."
            expect: accept

          - id: alice-sec2-create
            parents: [alice-sec1-create]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: sec-2
              object_type: section
              op_type: create
              op_version: 1
              body:
                document_id: doc-1
                position: "k"
                title: "Architecture"
                body: "Initial architecture."
            expect: accept

          - id: alice-sec2-edit
            parents: [alice-sec2-create]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: sec-2
              object_type: section
              op_type: edit
              op_version: 1
              body:
                body: "Alice architecture proposal."
            expect: accept

  - name: refs/writ/fedcba9876543210/section
    history:
      - commits:
          - id: bob-sec2-edit
            parents: [alice-sec2-create]
            author: bob
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: sec-2
              object_type: section
              op_type: edit
              op_version: 1
              body:
                body: "Bob architecture proposal."
            expect: accept

          - id: bob-sec2-move
            parents: [bob-sec2-edit]
            author: bob
            timestamp: 2026-01-01T00:07:00Z
            op:
              object_id: sec-2
              object_type: section
              op_type: move
              op_version: 1
              body:
                position: "1"
            expect: accept
