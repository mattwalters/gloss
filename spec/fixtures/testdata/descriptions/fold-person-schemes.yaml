name: fold-person-schemes
description: >
  Scheme-prefixed person identifiers (spec/identifiers.md §Person identifiers)
  through the fold. Pins the three rules that make two implementations agree on
  who an op refers to: schemes never unify, so 'user:alice' and
  'email:alice@example.com' are two members of the assignee OR-set and removing
  one leaves the other; an unrecognized scheme ('keybase:alice') is preserved
  and compared byte-wise like any other; and a value carrying its own colon
  ('email:"a:b"@example.com', a quoted local part) survives folding intact
  because the identifier splits at its FIRST colon. Normalization is structural,
  so whitespace between the colon and the value is trimmed with the value
  ('user:   Dana   ' and 'USER:dana' are one member); a rule that folded the
  identifier as one flat string would leave two. A non-human writer is
  'user:ci' — the scheme exists so an actor with no mailbox does not need a
  fictional one.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-03-01T00:00:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Person Identifier Schemes Test"
            expect: accept

          - id: alice-revision
            parents: [alice-create]
            author: alice
            timestamp: 2026-03-01T00:01:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0000000000000000000000000000000000000001"
                head: "0000000000000000000000000000000000000002"
            expect: accept

          # The same human under two schemes, plus a scheme this reader does
          # not know and a non-human writer. Four distinct identifiers.
          - id: alice-assign-cross-scheme
            parents: [alice-revision]
            author: alice
            timestamp: 2026-03-01T00:02:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: assign
              op_version: 1
              body:
                add:
                  - "user:alice"
                  - "email:alice@example.com"
                  - "keybase:alice"
                  - "user:ci"
            expect: accept

          # Whitespace between the colon and the value belongs to the value and
          # is trimmed there. Normalizing the identifier as one flat string
          # keeps it, and this member folds as "user:   dana" instead — two
          # members for one person, and no reader can tell which is meant.
          - id: alice-assign-padded-value
            parents: [alice-assign-cross-scheme]
            author: alice
            timestamp: 2026-03-01T00:02:30Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: assign
              op_version: 1
              body:
                add: ["user:   Dana   ", "USER:dana"]
            expect: accept

          # Removing the user-scheme identifier must not touch the
          # email-scheme one, however obvious the human unification is.
          - id: alice-remove-user-scheme
            parents: [alice-assign-padded-value]
            author: alice
            timestamp: 2026-03-01T00:03:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: assign
              op_version: 1
              body:
                remove: ["user:alice"]
            expect: accept

          # A quoted local part carrying a colon. Splitting anywhere but the
          # first colon reads the scheme as 'email:"a', which is not a scheme.
          - id: alice-approval-quoted-local-part
            parents: [alice-remove-user-scheme]
            author: alice
            timestamp: 2026-03-01T00:04:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                subject: "email:\"a:b\"@example.com"
                message: "Approval subject with a colon inside a quoted local part"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      # Concurrent approvals under two schemes for the same human. They key
      # separately: two entries, not one overwriting the other.
      - commits:
          - id: bob-approval-user-scheme
            parents: [alice-remove-user-scheme]
            author: bob
            timestamp: 2026-03-01T00:05:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: request-changes
                subject: "user:bob"
                message: "Bob under the user scheme"
            expect: accept

          - id: bob-approval-email-scheme
            parents: [bob-approval-user-scheme]
            author: bob
            timestamp: 2026-03-01T00:06:00Z
            op:
              object_id: r-person-schemes
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                subject: "  EMAIL:Bob@Example.COM  "
                message: "Same human, other scheme, denormalized; a separate key"
            expect: accept
