name: settings-concurrent-edits
description: >
  Two writers (Alice and Bob) concurrently update distinct and overlapping settings properties.
  Alice sets timezone and estimate_scale, while Bob sets timezone and cycles_enabled.
  Exercises per-field LWW resolution across concurrent commits on the settings object.

refs:
  - name: refs/writ/0123456789abcdef/settings
    history:
      - commits:
          - id: alice-set
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: set
              op_version: 1
              body:
                name: "Writ Workspace"
                timezone: "America/New_York"
                estimate_scale: "t-shirt"
            expect: accept

  - name: refs/writ/fedcba9876543210/settings
    history:
      - commits:
          - id: bob-set
            author: bob
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: set
              op_version: 1
              body:
                timezone: "Europe/London"
                cycles_enabled: true
                cycle_duration_weeks: 3
            expect: accept
