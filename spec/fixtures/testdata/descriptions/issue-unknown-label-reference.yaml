name: issue-unknown-label-reference
description: >
  Demonstrates referential tolerance under rule FC-16: an issue references a label
  object ID that is not present in the local repository. The issue folds normally
  without error or rejection, retaining the unresolved label ID.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-issue-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: iss-dangling-lbl
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Dangling label test issue"
            expect: accept

          - id: alice-label-add
            parents: [alice-issue-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: iss-dangling-lbl
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["0123456789abcdef0123456789abcdef"]
            expect: accept
