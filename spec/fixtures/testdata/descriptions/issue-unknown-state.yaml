name: issue-unknown-state
description: >
  Issue i-unknown transitions to an unknown/unfetched workflow-state ID.
  Under distributed referential integrity rules, the operation is accepted
  and folds cleanly without error, preserving the state reference verbatim.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-unknown
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Issue with Unfetched State"
                description: "This issue moves to a state not yet fetched"
            expect: accept

          - id: alice-set-unknown-state
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-unknown
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "0123456789abcdef0123456789abcdef"
                reason: "moved to custom triage state"
            expect: accept
