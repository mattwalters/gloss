name: settings-unknown-keys
description: >
  Settings operations carrying unknown schema keys alongside known fields,
  and an unknown op type. Under forward-compatibility rules, fold preserves
  unknown body keys in unknown_keys and records unknown op types in unknown_ops.

refs:
  - name: refs/writ/0123456789abcdef/settings
    history:
      - commits:
          - id: alice-set-future
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: set
              op_version: 1
              body:
                name: "Future Workspace"
                custom_theme: "dark"
                notification_channel: "#general"
            expect: accept

          - id: alice-unknown-op
            parents: [alice-set-future]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: archive
              op_version: 1
              body:
                reason: "test archive op"
            expect: accept

  - name: refs/writ/fedcba9876543210/settings
    history:
      - commits:
          - id: bob-set-known
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: 00000000000000000000000073657474
              object_type: settings
              op_type: set
              op_version: 1
              body:
                identifier: "WRIT"
            expect: accept
