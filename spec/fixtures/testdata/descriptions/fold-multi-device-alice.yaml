name: fold-multi-device-alice
description: >
  Single author (Alice) across two devices (writer IDs 0123456789abcdef and 550e8400e29b41d4)
  with racing edits on review r-multi-device, reconciled via a cross-device causal parent edge.

refs:
  - name: refs/writ/550e8400e29b41d4/review
    history:
      - commits:
          - id: alice-init-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-multi-device
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Initial Title"
                description: "Created on initial device"
            expect: accept

          - id: alice-desktop-edit
            parents: [alice-init-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-multi-device
              object_type: review
              op_type: update
              op_version: 1
              body:
                title: "Desktop Updated Title"
            expect: accept

  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-laptop-edit
            parents: [alice-init-create]
            author: alice
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: r-multi-device
              object_type: review
              op_type: update
              op_version: 1
              body:
                description: "Updated description on laptop"
            expect: accept

          - id: alice-laptop-sync
            parents: [alice-laptop-edit, alice-desktop-edit]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-multi-device
              object_type: review
              op_type: set-status
              op_version: 1
              body:
                status: "open"
            expect: accept
