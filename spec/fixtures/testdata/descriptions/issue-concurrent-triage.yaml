name: issue-concurrent-triage
description: >
  Concurrent assign and label add vs remove operations across Alice and Bob.
  Exercises both causal remove (remove wins when it causally succeeds add)
  and concurrent add/remove (add wins when operations are concurrent).

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Concurrent Triage Issue"
                description: "Testing concurrent triage operations"
            expect: accept

          - id: alice-triage-1
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: assign
              op_version: 1
              body:
                add: ["user:alice", "email:bob@example.com"]
            expect: accept

          - id: alice-label-1
            parents: [alice-triage-1]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["bug", "needs-triage"]
            expect: accept

          - id: alice-causal-removes
            parents: [alice-label-1]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: assign
              op_version: 1
              body:
                remove: ["email:bob@example.com"]
            expect: accept

          - id: alice-causal-label-remove
            parents: [alice-causal-removes]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: label
              op_version: 1
              body:
                remove: ["needs-triage"]
            expect: accept

          - id: alice-concurrent-remove-assign
            parents: [alice-causal-label-remove]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: assign
              op_version: 1
              body:
                remove: ["user:charlie"]
            expect: accept

          - id: alice-concurrent-remove-label
            parents: [alice-concurrent-remove-assign]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: label
              op_version: 1
              body:
                remove: ["documentation"]
            expect: accept

  - name: refs/writ/fedcba9876543210/issue
    history:
      - commits:
          - id: bob-concurrent-add-assign
            parents: [alice-causal-label-remove]
            author: bob
            timestamp: 2026-01-01T00:05:30Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: assign
              op_version: 1
              body:
                add: ["user:charlie"]
            expect: accept

          - id: bob-concurrent-add-label
            parents: [bob-concurrent-add-assign]
            author: bob
            timestamp: 2026-01-01T00:06:30Z
            op:
              object_id: i-concurrent
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["documentation"]
            expect: accept
