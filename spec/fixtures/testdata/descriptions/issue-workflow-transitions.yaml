name: issue-workflow-transitions
description: >
  Issue i-wf-transitions created in default state, then transitioned through
  custom workflow state IDs representing backlog, started, and completed states.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-wf-transitions
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Workflow Transitions Issue"
                description: "Initial description"
            expect: accept

          - id: alice-set-backlog
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-wf-transitions
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "state-backlog-01"
                reason: "placed in backlog"
            expect: accept

          - id: alice-set-in-progress
            parents: [alice-set-backlog]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: i-wf-transitions
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "state-in-progress-02"
                reason: "started development"
            expect: accept

          - id: alice-set-done
            parents: [alice-set-in-progress]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: i-wf-transitions
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "state-done-03"
                reason: "verified and closed"
            expect: accept
