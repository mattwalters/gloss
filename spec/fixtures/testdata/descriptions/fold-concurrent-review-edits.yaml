name: fold-concurrent-review-edits
description: >
  Alice and Bob fork from a shared create op on review r-concurrent.
  They write concurrent update ops for title and description (lww),
  concurrent set-status ops (lww), and append revision ops.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Initial Title"
                description: "Initial Description"
            expect: accept

          - id: alice-rev1
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "1111111111111111111111111111111111111111"
            expect: accept

          - id: alice-update
            parents: [alice-rev1]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: update
              op_version: 1
              body:
                title: "Alice Title"
                description: "Alice Description"
            expect: accept

          - id: alice-status
            parents: [alice-update]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: set-status
              op_version: 1
              body:
                status: "closed"
                reason: "Closed by Alice"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-rev2
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "2222222222222222222222222222222222222222"
            expect: accept

          - id: bob-update
            parents: [bob-rev2]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: update
              op_version: 1
              body:
                title: "Bob Title"
            expect: accept

          - id: bob-status
            parents: [bob-update]
            author: bob
            timestamp: 2026-01-01T00:03:30Z
            op:
              object_id: r-concurrent
              object_type: review
              op_type: set-status
              op_version: 1
              body:
                status: "open"
                reason: "Reopened by Bob"
                merge_commit: "3333333333333333333333333333333333333333"
            expect: accept
