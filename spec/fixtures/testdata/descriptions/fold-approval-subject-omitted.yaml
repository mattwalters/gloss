name: fold-approval-subject-omitted
description: >
  Approval ops omitting the subject field from distinct commit authors (Alice and Bob)
  on the same revision head. Verifies that keyed-lww attributes subjectless approvals to
  the op commit author's email identifier (email:<author.email>), ensuring distinct
  reviewers' approvals do not overwrite each other under keyed-lww.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-subject-omitted
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Omitted Approval Subject Test"
            expect: accept

          - id: alice-revision
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-subject-omitted
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0000000000000000000000000000000000000001"
                head: "0000000000000000000000000000000000000002"
            expect: accept

          - id: alice-app
            parents: [alice-revision]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-subject-omitted
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                message: "Alice approves without subject"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-app
            parents: [alice-revision]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-subject-omitted
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: request-changes
                message: "Bob requests changes without subject"
            expect: accept
