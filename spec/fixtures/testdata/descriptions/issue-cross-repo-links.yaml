name: issue-cross-repo-links
description: >
  Single issue object i-links exercising cross-repository links, link retraction
  via relation: "none", retitling, and preservation of unknown op types and future op versions.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Cross Repo Links Issue"
                description: "Testing cross repo links and retraction"
            expect: accept

          - id: alice-link-bare
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: link
              op_version: 1
              body:
                target: "0123456789abcdef0123456789abcdef"
                target_type: "review"
                relation: "fixes"
            expect: accept

          - id: alice-link-cross
            parents: [alice-link-bare]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: link
              op_version: 1
              body:
                target: "repo-backend#fedcba9876543210fedcba9876543210"
                target_type: "review"
                relation: "relates"
            expect: accept

          - id: alice-update
            parents: [alice-link-cross]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: update
              op_version: 1
              body:
                title: "Cross Repo Links Issue — Revised"
            expect: accept

          - id: alice-retract-bare
            parents: [alice-update]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: link
              op_version: 1
              body:
                target: "0123456789abcdef0123456789abcdef"
                relation: "none"
            expect: accept

  - name: refs/writ/fedcba9876543210/issue
    history:
      - commits:
          - id: bob-unknown-type
            parents: [alice-retract-bare]
            author: bob
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: archive
              op_version: 1
              body:
                reason: "archive issue"
            expect: accept

          - id: bob-future-version
            parents: [bob-unknown-type]
            author: bob
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: i-links
              object_type: issue
              op_type: update
              op_version: 2
              body:
                title: "V2 Future Title"
            expect: accept
