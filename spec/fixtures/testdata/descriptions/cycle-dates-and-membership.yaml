name: cycle-dates-and-membership
description: >
  Single cycle object c-dates exercising cycle creation, metadata update,
  concurrent set-dates operations, bare and cross-repo member issue references, and member removal.

refs:
  - name: refs/writ/0123456789abcdef/cycle
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: create
              op_version: 1
              body:
                title: "Sprint 10"
                description: "Sprint 10 description"
                starts_at: "2026-09-01T00:00:00Z"
                ends_at: "2026-09-15T00:00:00Z"
            expect: accept

          - id: alice-update
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: update
              op_version: 1
              body:
                title: "Sprint 10 — Core & Transport"
            expect: accept

          - id: alice-add-bare
            parents: [alice-update]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: add-issue
              op_version: 1
              body:
                issue: "0123456789abcdef0123456789abcdef"
            expect: accept

          - id: alice-add-cross
            parents: [alice-add-bare]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: add-issue
              op_version: 1
              body:
                issue: "repo-bridge#fedcba9876543210fedcba9876543210"
            expect: accept

          - id: alice-set-dates
            parents: [alice-add-cross]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: set-dates
              op_version: 1
              body:
                starts_at: "2026-09-01T00:00:00Z"
                ends_at: "2026-09-20T00:00:00Z"
            expect: accept

          - id: alice-rem-bare
            parents: [alice-set-dates]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: remove-issue
              op_version: 1
              body:
                issue: "0123456789abcdef0123456789abcdef"
            expect: accept

  - name: refs/writ/fedcba9876543210/cycle
    history:
      - commits:
          - id: bob-set-dates-concurrent
            parents: [alice-add-cross]
            author: bob
            timestamp: 2026-01-01T00:04:30Z
            op:
              object_id: c-dates
              object_type: cycle
              op_type: set-dates
              op_version: 1
              body:
                starts_at: "2026-09-02T00:00:00Z"
                ends_at: "2026-09-22T00:00:00Z"
            expect: accept
