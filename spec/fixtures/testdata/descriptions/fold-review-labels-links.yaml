name: fold-review-labels-links
description: >
  Labeling and cross-reference link operations on a code review object from
  multiple writers (Alice and Bob), exercising label:add and label:remove under
  set-observed-remove (add-wins OR-set) and link:target, link:target_type, and
  link:relation under keyed-lww with link retraction via relation: "none".

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Review Labels and Links Test"
                description: "Testing review labels and cross references"
            expect: accept

          - id: alice-label-initial
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: label
              op_version: 1
              body:
                add: ["area/engine", "wip"]
            expect: accept

          - id: alice-link-bare
            parents: [alice-label-initial]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: link
              op_version: 1
              body:
                target: "0123456789abcdef0123456789abcdef"
                target_type: "issue"
                relation: "fixes"
            expect: accept

          - id: alice-link-qualified
            parents: [alice-link-bare]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: link
              op_version: 1
              body:
                target: "repo-backend#fedcba9876543210fedcba9876543210"
                target_type: "issue"
                relation: "relates"
            expect: accept

          - id: alice-relabel
            parents: [alice-link-qualified]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: label
              op_version: 1
              body:
                remove: ["wip"]
                add: ["needs-docs"]
            expect: accept

          - id: alice-retract-link
            parents: [alice-relabel]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: link
              op_version: 1
              body:
                target: "0123456789abcdef0123456789abcdef"
                relation: "none"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-concurrent-label
            parents: [alice-label-initial]
            author: bob
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-labels-links
              object_type: review
              op_type: label
              op_version: 1
              body:
                remove: ["needs-docs"]
                add: ["priority/high"]
            expect: accept
