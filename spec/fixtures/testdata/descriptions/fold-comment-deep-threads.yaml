name: fold-comment-deep-threads
description: >
  Deeply nested comment threads exercising: a depth-3 reply chain, a dangling
  reply pointing to an absent parent, an anchored reply, and concurrent create
  ops on a single comment object racing create-once fields (subject, in_reply_to, anchor)
  vs LWW text.

refs:
  - name: refs/writ/0123456789abcdef/comment
    history:
      - commits:
          - id: alice-croot-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: c-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                text: "Root comment at depth 0"
            expect: accept

          - id: alice-creply1-create
            parents: [alice-croot-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: c-reply-1
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-root"
                text: "Reply at depth 1"
            expect: accept

          - id: alice-creply2-create
            parents: [alice-creply1-create]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: c-reply-2
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-reply-1"
                text: "Reply at depth 2"
            expect: accept

          - id: alice-creply3-create
            parents: [alice-creply2-create]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: c-reply-3
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-reply-2"
                text: "Reply at depth 3"
            expect: accept

          - id: alice-cdangling-create
            parents: [alice-creply3-create]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: c-dangling
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-absent-parent"
                text: "Dangling reply with absent parent"
            expect: accept

          - id: alice-canchored-create
            parents: [alice-cdangling-create]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: c-anchored-reply
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-root"
                text: "Anchored reply to root"
                anchor:
                  version: 1
                  new:
                    commit: "1111111111111111111111111111111111111111"
                    path: "engine/comment.go"
                    blob: "3333333333333333333333333333333333333333"
                    range:
                      start: 5
                      end: 10
                    context:
                      before:
                        - "package writ"
                      lines:
                        - "func FoldComment() {"
                        - "\treturn"
                      after:
                        - "}"
            expect: accept

          - id: alice-craced-create
            parents: [alice-canchored-create]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: c-raced
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-deep
                in_reply_to: "c-root"
                text: "Alice winning create-once fields"
                anchor:
                  version: 1
                  new:
                    commit: "1111111111111111111111111111111111111111"
                    path: "alice.go"
                    blob: "4444444444444444444444444444444444444444"
                    range:
                      start: 1
                      end: 2
                    context:
                      before: []
                      lines:
                        - "package alice"
                      after: []
            expect: accept

  - name: refs/writ/fedcba9876543210/comment
    history:
      - commits:
          - id: bob-craced-create
            parents: [alice-croot-create]
            author: bob
            timestamp: 2026-01-01T00:06:30Z
            op:
              object_id: c-raced
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: issue
                  object_id: i-deep
                in_reply_to: "c-dangling"
                text: "Bob concurrent create losing create-once but winning text LWW"
                anchor:
                  version: 1
                  new:
                    commit: "2222222222222222222222222222222222222222"
                    path: "bob.go"
                    blob: "5555555555555555555555555555555555555555"
                    range:
                      start: 1
                      end: 2
                    context:
                      before: []
                      lines:
                        - "package bob"
                      after: []
            expect: accept
