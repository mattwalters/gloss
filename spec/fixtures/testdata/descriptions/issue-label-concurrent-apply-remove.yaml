name: issue-label-concurrent-apply-remove
description: >
  Demonstrates label reference addition and removal on an issue under concurrent writers.
  Writer 1 removes a label reference while Writer 2 concurrently adds it.
  Under add-wins OR-set fold semantics, the concurrent add survives.

refs:
  - name: refs/writ/0123456789abcdef/label
    history:
      - commits:
          - id: alice-label-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: lbl-sec
              object_type: label
              op_type: create
              op_version: 1
              body:
                name: "security"
                color: "#ff0000"
                description: "Security issue"
            expect: accept

  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-issue-create
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: iss-lbl-conc
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Vulnerability in auth"
            expect: accept

          - id: alice-label-add
            parents: [alice-issue-create]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: iss-lbl-conc
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["lbl-sec"]
            expect: accept

          - id: alice-label-remove
            parents: [alice-label-add]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: iss-lbl-conc
              object_type: issue
              op_type: label
              op_version: 1
              body:
                remove: ["lbl-sec"]
            expect: accept

  - name: refs/writ/fedcba9876543210/issue
    history:
      - commits:
          - id: bob-label-add
            parents: [alice-label-add]
            author: bob
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: iss-lbl-conc
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["lbl-sec"]
            expect: accept
