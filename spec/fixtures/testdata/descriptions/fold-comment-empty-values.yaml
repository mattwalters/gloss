name: fold-comment-empty-values
description: >
  Comment empty value handling: whitespace-only resolved_by normalization
  to empty string in resolve op, and edit op setting text to empty string,
  verifying preservation of empty scalars in generic fold state and omission
  in typed serialization.

refs:
  - name: refs/writ/0123456789abcdef/comment
    history:
      - commits:
          - id: alice-blank-root-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: c-blank-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Comment to be resolved with whitespace-only actor"
            expect: accept

          - id: alice-blank-root-resolve
            parents: [alice-blank-root-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: c-blank-root
              object_type: comment
              op_type: resolve
              op_version: 1
              body:
                resolved: true
                resolved_by: "   "
            expect: accept

          - id: alice-empty-text-create
            parents: [alice-blank-root-resolve]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: c-empty-text
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Comment text before edit"
            expect: accept

          - id: alice-empty-text-edit
            parents: [alice-empty-text-create]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: c-empty-text
              object_type: comment
              op_type: edit
              op_version: 1
              body:
                text: ""
            expect: accept
