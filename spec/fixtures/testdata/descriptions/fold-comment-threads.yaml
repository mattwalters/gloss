name: fold-comment-threads
description: >
  Threaded comments exercising: concurrent edits (lww), concurrent delete vs edit
  (deletion wins, edit folds into state), causal edit after delete, and reply edges
  with immutable create fields (create-once).

refs:
  - name: refs/writ/0123456789abcdef/comment
    history:
      - commits:
          - id: alice-croot-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: c-root
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Original root comment"
                anchor:
                  version: 1
                  new:
                    commit: "1111111111111111111111111111111111111111"
                    path: "main.go"
                    blob: "2222222222222222222222222222222222222222"
                    range:
                      start: 10
                      end: 12
                    context:
                      before:
                        - "func main() {"
                      lines:
                        - "\tfmt.Println(\"hello\")"
                        - "\treturn"
                      after:
                        - "}"
            expect: accept

          - id: alice-croot-edit
            parents: [alice-croot-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: c-root
              object_type: comment
              op_type: edit
              op_version: 1
              body:
                text: "Alice edited root comment"
            expect: accept

          - id: alice-cdel-create
            parents: [alice-croot-edit]
            author: alice
            timestamp: 2026-01-01T00:01:10Z
            op:
              object_id: c-del-target
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                text: "Target for concurrent delete"
            expect: accept

          - id: alice-cdel-edit
            parents: [alice-cdel-create]
            author: alice
            timestamp: 2026-01-01T00:01:40Z
            op:
              object_id: c-del-target
              object_type: comment
              op_type: edit
              op_version: 1
              body:
                text: "Alice concurrent edit on del target"
            expect: accept

  - name: refs/writ/fedcba9876543210/comment
    history:
      - commits:
          - id: bob-croot-edit
            parents: [alice-croot-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: c-root
              object_type: comment
              op_type: edit
              op_version: 1
              body:
                text: "Bob edited root comment"
            expect: accept

          - id: bob-cdel-delete
            parents: [bob-croot-edit, alice-cdel-create]
            author: bob
            timestamp: 2026-01-01T00:01:40Z
            op:
              object_id: c-del-target
              object_type: comment
              op_type: delete
              op_version: 1
              body: {}
            expect: accept

          - id: bob-creply-create
            parents: [bob-cdel-delete]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: c-reply
              object_type: comment
              op_type: create
              op_version: 1
              body:
                subject:
                  object_type: review
                  object_id: r-7f3a
                in_reply_to: "c-root"
                text: "Bob reply comment"
            expect: accept

          - id: bob-creply-delete
            parents: [bob-creply-create]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: c-reply
              object_type: comment
              op_type: delete
              op_version: 1
              body: {}
            expect: accept

          - id: bob-creply-causal-edit
            parents: [bob-creply-delete]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: c-reply
              object_type: comment
              op_type: edit
              op_version: 1
              body:
                text: "Bob post-delete edit"
            expect: accept
