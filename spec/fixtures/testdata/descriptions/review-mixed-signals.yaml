name: review-mixed-signals
description: >
  Single review object r-mixed combining create with description, two revision pushes,
  concurrent set-status, approvals from Alice and Bob across both revisions,
  and two distinct ci-status checks on the same revision head (exercising field-name separation between revision, description, and message).

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Mixed Signals Review"
                description: "Initial description for mixed signals review."
            expect: accept

          - id: alice-rev1
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "1111111111111111111111111111111111111111"
            expect: accept

          - id: alice-rev2
            parents: [alice-rev1]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0123456789abcdef0123456789abcdef01234567"
                head: "2222222222222222222222222222222222222222"
            expect: accept

          - id: alice-app-r1
            parents: [alice-rev2]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                verdict: "approve"
                subject: "user:alice"
                message: "Alice approves r1"
            expect: accept

          - id: alice-status
            parents: [alice-app-r1]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: set-status
              op_version: 1
              body:
                status: "open"
            expect: accept

          - id: alice-ci-lint
            parents: [alice-status]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "2222222222222222222222222222222222222222"
                name: "ci/lint"
                state: "success"
                url: "https://ci.example.com/builds/lint"
                description: "Lint checks passed"
                started_at: "2026-01-01T00:04:30Z"
                completed_at: "2026-01-01T00:04:55Z"
                external_id: "lint-201"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-app-r1
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                verdict: "request-changes"
                subject: "email:bob@example.com"
                message: "Bob requests changes on r1"
            expect: accept

          - id: bob-app-r2
            parents: [bob-app-r1]
            author: bob
            timestamp: 2026-01-01T00:02:30Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "2222222222222222222222222222222222222222"
                verdict: "approve"
                subject: "email:bob@example.com"
                message: "Bob approves r2"
            expect: accept

          - id: bob-status
            parents: [bob-app-r2]
            author: bob
            timestamp: 2026-01-01T00:04:30Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: set-status
              op_version: 1
              body:
                status: "open"
                reason: "Ready for review"
            expect: accept

          - id: bob-ci-test
            parents: [bob-status]
            author: bob
            timestamp: 2026-01-01T00:05:30Z
            op:
              object_id: r-mixed
              object_type: review
              op_type: ci-status
              op_version: 1
              body:
                revision: "2222222222222222222222222222222222222222"
                name: "ci/test"
                state: "success"
                url: "https://ci.example.com/builds/test"
                description: "All unit and integration tests passed"
                started_at: "2026-01-01T00:04:00Z"
                completed_at: "2026-01-01T00:05:20Z"
                external_id: "test-202"
            expect: accept
