name: issue-empty-set-items
description: >
  Empty items in set-valued op bodies on an issue object. The companion of
  fold-empty-set-items for the typed FoldIssue reducer: op bodies are not
  schema-validated on the read/fold path, so an empty-string element can reach
  fold in a label or assign body, and every reducer MUST drop it before it
  enters the OR-set whatever the op type (spec/fold.md §5.3, §5.4). No later op
  removes the empty item, so a reducer that failed to drop it would surface it in
  the folded label set.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-02-01T00:00:00Z
            op:
              object_id: i-empty-items
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Empty Set Items Issue"
                description: "Empty elements must not enter set-valued folds"
            expect: accept

          - id: alice-label-with-empty
            parents: [alice-create]
            author: alice
            timestamp: 2026-02-01T00:01:00Z
            op:
              object_id: i-empty-items
              object_type: issue
              op_type: label
              op_version: 1
              body:
                add: ["", "bug", "wip"]
            expect: accept

          - id: alice-assign-with-empty
            parents: [alice-label-with-empty]
            author: alice
            timestamp: 2026-02-01T00:02:00Z
            op:
              object_id: i-empty-items
              object_type: issue
              op_type: assign
              op_version: 1
              body:
                add: ["   ", "email:Alice@Example.test"]
            expect: accept

          - id: alice-unlabel-with-empty
            parents: [alice-assign-with-empty]
            author: alice
            timestamp: 2026-02-01T00:03:00Z
            op:
              object_id: i-empty-items
              object_type: issue
              op_type: label
              op_version: 1
              body:
                remove: ["wip"]
            expect: accept
