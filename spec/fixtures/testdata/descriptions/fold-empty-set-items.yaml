name: fold-empty-set-items
description: >
  Empty items in set-valued op bodies, on a code review object from two writers
  (Alice and Bob). Op bodies are not schema-validated on the read/fold path, so a
  non-conforming writer can emit an empty-string element in a label or assign
  body. Every reducer MUST drop such elements before they enter the OR-set,
  whatever the op type (spec/fold.md §5.3, §5.4) — the generic fold driver, the
  reference fold, and the typed FoldReview reducer must agree. Object
  r-empty-items mixes empty and real items on both the add and remove sides; the
  empty label item is only ever removed concurrently (Bob), never causally, so
  add-wins would keep it present in a reducer that failed to drop it. Object
  r-empty-only carries nothing but empty items, pinning that the field is still
  written and folds to the empty set.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-02-01T00:00:00Z
            op:
              object_id: r-empty-items
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Empty Set Items Test"
                description: "Empty elements must not enter set-valued folds"
            expect: accept

          - id: alice-label-with-empty
            parents: [alice-create]
            author: alice
            timestamp: 2026-02-01T00:01:00Z
            op:
              object_id: r-empty-items
              object_type: review
              op_type: label
              op_version: 1
              body:
                add: ["", "area/fold", "wip"]
            expect: accept

          - id: alice-assign-with-empty
            parents: [alice-label-with-empty]
            author: alice
            timestamp: 2026-02-01T00:02:00Z
            op:
              object_id: r-empty-items
              object_type: review
              op_type: assign
              op_version: 1
              body:
                add: ["   ", "Alice@Example.test"]
            expect: accept

          - id: alice-unlabel-with-empty
            parents: [alice-assign-with-empty]
            author: alice
            timestamp: 2026-02-01T00:03:00Z
            op:
              object_id: r-empty-items
              object_type: review
              op_type: label
              op_version: 1
              body:
                remove: ["wip"]
            expect: accept

          - id: alice-create-empty-only
            parents: [alice-unlabel-with-empty]
            author: alice
            timestamp: 2026-02-01T00:04:00Z
            op:
              object_id: r-empty-only
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Empty Items Only"
                description: "Every set element is empty and every one is dropped"
            expect: accept

          - id: alice-label-empty-only
            parents: [alice-create-empty-only]
            author: alice
            timestamp: 2026-02-01T00:05:00Z
            op:
              object_id: r-empty-only
              object_type: review
              op_type: label
              op_version: 1
              body:
                add: [""]
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-concurrent-label
            parents: [alice-create]
            author: bob
            timestamp: 2026-02-01T00:02:30Z
            op:
              object_id: r-empty-items
              object_type: review
              op_type: label
              op_version: 1
              body:
                remove: [""]
                add: ["priority/high"]
            expect: accept
