name: fold-person-normalization
description: >
  Exercise person identifier normalization (email address, whitespace trimming,
  case folding, byte equality) on review assignees and review approvals across
  multiple writers. Verifies that '  Email:Alice@Example.COM  ' and 'email:alice@example.com'
  denote the same collaborative identity for add-wins assignees and keyed-lww approvals.

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Person Identifier Normalization Test"
            expect: accept

          - id: alice-revision
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: revision
              op_version: 1
              body:
                base: "0000000000000000000000000000000000000001"
                head: "0000000000000000000000000000000000000002"
            expect: accept

          - id: alice-assign-mixed
            parents: [alice-revision]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: assign
              op_version: 1
              body:
                add: ["  Email:Alice@Example.COM  ", "EMAIL:Bob@Example.Com"]
            expect: accept

          - id: alice-reassign
            parents: [alice-assign-mixed]
            author: alice
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: assign
              op_version: 1
              body:
                remove: ["email:alice@example.com"]
                add: [" email:Charlie@Example.COM "]
            expect: accept

          - id: alice-approval-mixed
            parents: [alice-reassign]
            author: alice
            timestamp: 2026-01-01T00:05:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: approve
                subject: "  Email:Carol@Example.COM  "
                message: "Approved with whitespace subject"
            expect: accept

          - id: alice-approval-update
            parents: [alice-approval-mixed]
            author: alice
            timestamp: 2026-01-01T00:06:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "0000000000000000000000000000000000000002"
                verdict: request-changes
                subject: "email:carol@example.com"
                message: "Updated verdict under normalized subject"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-concurrent-assign
            parents: [alice-assign-mixed]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-person-norm
              object_type: review
              op_type: assign
              op_version: 1
              body:
                remove: ["email:bob@example.com"]
                add: ["  EMAIL:DAVID@EXAMPLE.COM  "]
            expect: accept
