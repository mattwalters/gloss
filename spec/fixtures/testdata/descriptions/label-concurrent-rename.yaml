name: label-concurrent-rename
description: >
  Two writers (Alice and Bob) concurrently update properties of label lbl-rename.
  Alice updates name and color, while Bob concurrently updates name and description.
  Exercises field-level LWW merge semantics across concurrent commits on a label object.

refs:
  - name: refs/writ/0123456789abcdef/label
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: lbl-rename
              object_type: label
              op_type: create
              op_version: 1
              body:
                name: "bug"
                color: "#d73a4a"
                description: "Something is broken"
            expect: accept

          - id: alice-edit
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: lbl-rename
              object_type: label
              op_type: update
              op_version: 1
              body:
                name: "defect"
                color: "#e2b93c"
            expect: accept

  - name: refs/writ/fedcba9876543210/label
    history:
      - commits:
          - id: bob-edit
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: lbl-rename
              object_type: label
              op_type: update
              op_version: 1
              body:
                name: "critical-defect"
                description: "Critical bug report"
            expect: accept
