name: fold-approval-races
description: >
  Concurrent approval ops from two subjects (Alice and Bob) on revision heads
  r1 and r2, including Bob rewriting verdict on r2 and Alice issuing a verdict: "none"
  retraction (keyed-lww on [subject, revision]).

refs:
  - name: refs/writ/0123456789abcdef/review
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: r-approval
              object_type: review
              op_type: create
              op_version: 1
              body:
                title: "Approval Race Review"
            expect: accept

          - id: alice-app-r1
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: r-approval
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                verdict: "approve"
                subject: "user:alice"
                message: "Alice approves r1"
            expect: accept

          - id: alice-retract-r1
            parents: [alice-app-r1]
            author: alice
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: r-approval
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                verdict: "none"
                subject: "user:alice"
                message: "Alice retracts verdict on r1"
            expect: accept

  - name: refs/writ/fedcba9876543210/review
    history:
      - commits:
          - id: bob-app-r1
            parents: [alice-create]
            author: bob
            timestamp: 2026-01-01T00:01:30Z
            op:
              object_id: r-approval
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "1111111111111111111111111111111111111111"
                verdict: "request-changes"
                subject: "email:bob@example.com"
                message: "Bob requests changes on r1"
            expect: accept

          - id: bob-app-r2
            parents: [bob-app-r1]
            author: bob
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: r-approval
              object_type: review
              op_type: approval
              op_version: 1
              body:
                revision: "2222222222222222222222222222222222222222"
                verdict: "approve"
                subject: "email:bob@example.com"
                message: "Bob approves r2"
            expect: accept
