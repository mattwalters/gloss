name: issue-lifecycle
description: >
  Single issue object i-lifecycle exercising creation, metadata update,
  state transition to closed with reason, and subsequent reopening with reason.

refs:
  - name: refs/writ/0123456789abcdef/issue
    history:
      - commits:
          - id: alice-create
            author: alice
            timestamp: 2026-01-01T00:00:00Z
            op:
              object_id: i-lifecycle
              object_type: issue
              op_type: create
              op_version: 1
              body:
                title: "Issue Lifecycle"
                description: "Initial description"
            expect: accept

          - id: alice-update
            parents: [alice-create]
            author: alice
            timestamp: 2026-01-01T00:01:00Z
            op:
              object_id: i-lifecycle
              object_type: issue
              op_type: update
              op_version: 1
              body:
                title: "Issue Lifecycle — Revised"
            expect: accept

          - id: alice-close
            parents: [alice-update]
            author: alice
            timestamp: 2026-01-01T00:02:00Z
            op:
              object_id: i-lifecycle
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
                reason: "completed"
            expect: accept

  - name: refs/writ/fedcba9876543210/issue
    history:
      - commits:
          - id: bob-reopen
            parents: [alice-close]
            author: bob
            timestamp: 2026-01-01T00:03:00Z
            op:
              object_id: i-lifecycle
              object_type: issue
              op_type: set-state
              op_version: 1
              body:
                state: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                reason: "reopened with new requirements"
            expect: accept

          - id: bob-update-desc
            parents: [bob-reopen]
            author: bob
            timestamp: 2026-01-01T00:04:00Z
            op:
              object_id: i-lifecycle
              object_type: issue
              op_type: update
              op_version: 1
              body:
                description: "Updated description with new requirements"
            expect: accept
