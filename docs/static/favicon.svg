<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="writ">
  <!-- Solid tile with a white mark: legible at 16px, and reads against both
       light and dark tab bars, so no prefers-color-scheme variant is needed
       (favicon media queries are unevenly supported). -->
  <rect width="32" height="32" rx="7" fill="#0969da"/>
  <path d="M6 10 L11 22 L16 13 L21 22 L26 10"
        fill="none" stroke="#fff" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
